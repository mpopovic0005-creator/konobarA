<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Vision Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .upload-box { border: 2px dashed #475569; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; }
        .upload-box:hover { border-color: #38bdf8; }
        input[type="file"] { display: none; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        #preview { max-width: 100%; margin-top: 15px; border-radius: 6px; display: none; }
        .result { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 6px; white-space: pre-wrap; font-size: 14px; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="card">
    <h2>Trading Vision Bot</h2>
    
    <label class="upload-box" for="fileInput">
        <span id="uploadText">📷 Klikni ovde da izabereš sliku grafikona</span>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
    </label>

    <img id="preview" alt="Pregled grafikona">

    <button onclick="analyzeImage()" style="margin-top: 15px;">Pokreni Analizu</button>

    <div id="result" class="result" style="display:none;">Čeka se slika i analiza...</div>
</div>

<script>
    let base64Image = "";

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result;
                const preview = document.getElementById('preview');
                preview.src = base64Image;
                preview.style.display = 'block';
                document.getElementById('uploadText').innerText = "Slika izabrana: " + file.name;
            }
            reader.readAsDataURL(file);
        }
    }

    function analyzeImage() {
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (!base64Image) {
            resultDiv.innerText = "Prvo izaberi sliku grafikona!";
            return;
        }

        resultDiv.innerText = "Analiziram grafikon... (Sačekaj trenutak)";
        
        // Ovde možemo direktno da povežemo logiku ili preusmerimo sliku
        setTimeout(() => {
            resultDiv.innerText = "📢 REZULTAT ANALIZE:\n\n- FVG: Detektovan u donjem delu.\n- POC: Blizu trenutne cene.\n- Zona: Cena je u Demand zoni.\n\n🚀 SIGNAL: BUY (Sve konfluencije su tu!)";
        }, 1500);
    }
</script>

</body>
</html>
