<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Chart Analyzer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #2980b9;
            --text-color: #e0e0e0;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h1, h2, h3 {
            margin-top: 0;
            color: #ffffff;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"], input[type="password"] {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .drop-zone {
            border: 2px dashed var(--accent-color);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: #181818;
            transition: background 0.2s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background: #252525;
        }

        .preview-img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            border: 1px solid var(--border-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #3498db;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .output-box {
            margin-top: 10px;
            display: none;
        }

        .signal-header {
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }

        .BUY { background-color: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .SELL { background-color: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        .WAIT { background-color: rgba(241, 196, 15, 0.2); color: #f1c40f; border: 1px solid #f1c40f; }

        .data-row {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .data-row strong {
            color: #fff;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Trading Chart Analyzer</h1>

    <!-- Podešavanja -->
    <div class="card">
        <h3>Podešavanja</h3>
        <div class="settings-group">
            <label for="apiKey">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="Unesi svoj Gemini API ključ ovde">
        </div>
    </div>

    <!-- Upload i Drag & Drop Zone -->
    <div class="card">
        <h3>Slička čarta</h3>
        <div class="drop-zone" id="dropZone">
            <p>Prevuci sliku čarta ovde, nalepi je (Ctrl+V) ili klikni za izbor</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <img id="previewImg" class="preview-img" alt="Čart Pregled">
        </div>
        <button id="analyzeBtn" onclick="runAnalysis()" disabled>Analiziraj Čart</button>
    </div>

    <!-- Rezultat -->
    <div class="card output-box" id="outputCard">
        <h3>Rezultat Analize</h3>
        <div id="analysisContent"></div>
    </div>
</div>

<script>
    let currentBase64Image = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewImg = document.getElementById('previewImg');
    const analyzeBtn = document.getElementById('analyzeBtn');

    // Drag and Drop događaji
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    // Paste handler za Ctrl+V sliku iz clipboard-a
    document.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
            if (item.kind === 'file' && item.type.startsWith('image/')) {
                const blob = item.getAsFile();
                handleFile(blob);
                break;
            }
        }
    });

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            currentBase64Image = e.target.result;
            previewImg.src = currentBase64Image;
            previewImg.style.display = 'block';
            analyzeBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    }

    // Poziv Gemini API-ja sa rigidnim promptom i temperature 0
    async function runAnalysis() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert("Molim te unesi Gemini API ključ u podešavanjima.");
            return;
        }

        if (!currentBase64Image) {
            alert("Molim te ubaci sliku čarta.");
            return;
        }

        const outputCard = document.getElementById('outputCard');
        const analysisContent = document.getElementById('analysisContent');

        analyzeBtn.disabled = true;
        analyzeBtn.innerText = "Analiziram čart...";
        outputCard.style.display = 'block';
        analysisContent.innerHTML = "<p>Sistem obrađuje parametre (FVG, BOS, Liquidity)...</p>";

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKey}`;

        const promptText = `
Ti si profesionalni institucionalni trejder i ekspertski sistem za analizu tehničkih čartova.
Tvoj zadatak je da analiziraš priloženu sliku čarta i pružiš apsolutno konsistentnu, determinističku i preciznu analizu.

STROGA PRAVILA ANALIZE:
1. Identifikuj ključne tehničke elemente:
   - Market Structure (BOS - Break of Structure, CHoCH - Change of Character)
   - Liquidity Pools (BSL - Buy-side Liquidity, SSL - Sell-side Liquidity)
   - Inefficiencies (FVG - Fair Value Gap, Imbalance)
   - Key Support/Resistance ili Order Blocks.
2. Na osnovu ovih elemenata, MORAŠ doneti jasnu odluku. Dvosmislenost NIJE dozvoljena.

OBAVEZAN FORMAT ODGOVORA (Vrati tačno ovaj JSON format bez dodatnog teksta):
{
  "signal": "BUY" | "SELL" | "WAIT",
  "confidence": "Visoka" | "Srednja" | "Niska",
  "technical_setup": {
    "structure": "Kratak opis strukture",
    "fvg_status": "Kratak opis FVG zone",
    "liquidity": "Kratak opis gde se nalazi target likvidnost"
  },
  "trade_plan": {
    "entry": "Preporučena entry zona ili cena",
    "stop_loss": "Preporučena SL zona",
    "take_profit": "Preporučena TP zona"
  },
  "justification": "Detaljno, logično objašnjenje u 2-3 rečenice zašto je doneta ova odluka."
}
`;

        const requestBody = {
            contents: [
                {
                    parts: [
                        { text: promptText },
                        {
                            inline_data: {
                                mime_type: "image/png",
                                data: currentBase64Image.split(",")[1]
                            }
                        }
                    ]
                }
            ],
            generationConfig: {
                temperature: 0,
                topP: 1,
                responseMimeType: "application/json"
            }
        };

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error(`API Greška: ${response.statusText}`);
            }

            const data = await response.json();
            const rawContent = data.candidates[0].content.parts[0].text;
            const res = JSON.parse(rawContent);

            renderOutput(res);

        } catch (err) {
            console.error(err);
            analysisContent.innerHTML = `<p style="color: #e74c3c;">Greška prilikom analize: ${err.message}. Proveri API ključ i ponovi.</p>`;
        } finally {
            analyzeBtn.disabled = false;
            analyzeBtn.innerText = "Analiziraj Čart";
        }
    }

    function renderOutput(data) {
        const analysisContent = document.getElementById('analysisContent');
        analysisContent.innerHTML = `
            <div class="signal-header ${data.signal}">
                SIGNAL: ${data.signal} (Pouzdanost: ${data.confidence})
            </div>
            <div class="data-row"><strong>Struktura:</strong> ${data.technical_setup.structure}</div>
            <div class="data-row"><strong>FVG:</strong> ${data.technical_setup.fvg_status}</div>
            <div class="data-row"><strong>Likvidnost:</strong> ${data.technical_setup.liquidity}</div>
            <hr>
            <div class="data-row"><strong>Entry (Ulaz):</strong> ${data.trade_plan.entry}</div>
            <div class="data-row"><strong>Stop Loss:</strong> ${data.trade_plan.stop_loss}</div>
            <div class="data-row"><strong>Take Profit:</strong> ${data.trade_plan.take_profit}</div>
            <hr>
            <div class="data-row"><strong>Obrazloženje:</strong> ${data.justification}</div>
        `;
    }
</script>

</body>
</html>
