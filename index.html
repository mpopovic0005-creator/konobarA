<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, button { margin-top: 15px; width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        #rezultat { margin-top: 20px; white-space: pre-wrap; background: #2a2a2a; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Trading Chart Analizator</h2>
    
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="analizirajGrafikon()">Analiziraj Sliku i Daj Signal</button>
    
    <div id="loading" style="display:none; margin-top: 15px;">Analiza u toku...</div>
    <div id="rezultat"></div>
</div>

<script>
    // 1. ZAMENI "TVOJ_GEMINI_API_KEY" SA TVOJIM STVARNIM GEMINI API KLJUČEM
    const API_KEY = "TVOJ_GEMINI_API_KEY";

    // 2. Sistemski prompt koji eliminiše "WAIT" odgovore
    const SYSTEM_INSTRUCTION = `
Ti si stručni analitičar tehničke analize (SMC / Price Action).
Tvoj zadatak je da na osnovu priložene slike grafikona ODMAH proceniš najbolju verovatnoću i pružiš konkretan signal.

Pravila:
1. Nikada nemoj odbiti davanje signala niti pisati "WAIT" ili "NEMA ULAZKA".
2. Na osnovu vidljive strukture (BOS/CHoCH), Fair Value Gaps (FVG) i likvidnosti, izaberi najverovatniji smer: BUY ili SELL.
3. Ako je tržište u konsolidaciji, odredi smer na osnovu bližeg sweep-a likvidnosti ili trenutnog momenta.
4. Tvoj odgovor MORA pratiti sledeći format:
   - ODLUKA: [BUY ili SELL]
   - RAZLOG: [Objašnjenje u 2-3 rečenice šta vidiš na slici - BOS, FVG, Liquidity sweep]
   - ENTRY: [Okvirni nivo za ulaz na osnovu slike]
   - STOP LOSS: [Nivo iznad/ispod ključnog high/low]
   - TAKE PROFIT: [Nivo sledeće likvidnosti ili FVG-a]

Budi direktan, presudan i daj konkretne parametre bez izgovora.
`;

    async function analizirajGrafikon() {
        const fileInput = document.getElementById('imageInput');
        const resultDiv = document.getElementById('rezultat');
        const loadingDiv = document.getElementById('loading');

        if (!fileInput.files[0]) {
            alert('Molimo izaberi sliku grafikona!');
            return;
        }

        loadingDiv.style.display = 'block';
        resultDiv.innerText = '';

        const file = fileInput.files[0];
        const base64Image = await convertBase64(file);
        const base64Data = base64Image.split(',')[1];

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=${API_KEY}`;

        const payload = {
            system_instruction: {
                parts: [{ text: SYSTEM_INSTRUCTION }]
            },
            contents: [{
                parts: [
                    { text: "Analiziraj ovaj chart i daj mi konkretan trade signal." },
                    {
                        inline_data: {
                            mime_type: file.type,
                            data: base64Data
                        }
                    }
                ]
            }],
            generationConfig: {
                temperature: 0.2
            }
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            loadingDiv.style.display = 'none';

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                resultDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                resultDiv.innerText = "Greška u odgovoru API-ja: " + JSON.stringify(data);
            }
        } catch (error) {
            loadingDiv.style.display = 'none';
            resultDiv.innerText = "Greška prilikom slanja zahteva: " + error.message;
        }
    }

    function convertBase64(file) {
        return new Promise((resolve, reject) => {
            const fileReader = new FileReader();
            fileReader.readAsDataURL(file);
            fileReader.onload = () => resolve(fileReader.result);
            fileReader.onerror = (error) => reject(error);
        });
    }
</script>

</body>
</html>
