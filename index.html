<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PP Konobar</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="IMG_0827.png">

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PP Konobar">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    .app-header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .app-header h1 { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }
    .btn-icon { background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }

    /* Main Container */
    .main-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }

    /* Pretraga i Lista */
    .search-box { margin-bottom: 20px; }
    .search-input { width: 100%; padding: 14px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #fff; font-size: 1rem; outline: none; }
    .search-input:focus { border-color: #38bdf8; }

    .restaurant-list { display: flex; flex-direction: column; gap: 12px; }
    .restaurant-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
    .restaurant-card:active { transform: scale(0.98); background: #334155; }
    .card-left { display: flex; align-items: center; gap: 14px; }
    .restaurant-card img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }
    .restaurant-info h3 { font-size: 1rem; color: #f8fafc; margin-bottom: 2px; }
    .restaurant-info p { font-size: 0.85rem; color: #94a3b8; }
    .qr-btn { background: #334155; border: none; color: #38bdf8; padding: 8px 12px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }

    /* Čat prikaz */
    .chat-container { display: none; flex-direction: column; height: 100%; }
    .chat-header { background: #1e293b; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #334155; }
    .chat-header img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; }
    .msg.bot { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.user { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }

    .chat-footer { padding: 12px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155; }
    .chat-input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 20px; padding: 10px 16px; color: #fff; outline: none; }
    .send-btn { background: #0284c7; color: #fff; border: none; border-radius: 20px; padding: 0 18px; font-weight: 600; cursor: pointer; }

    /* Modali */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    .modal-content input { padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; }
    .modal-content button { padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

    .qr-image { width: 220px; height: 220px; margin: 10px auto; border-radius: 12px; background: #fff; padding: 10px; }
    .info-text { text-align: center; color: #64748b; margin-top: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- Glavni Header -->
  <div class="app-header" id="mainHeader">
    <h1>PP Konobar</h1>
    <button class="btn-icon" onclick="toggleModal('settingsModal', true)">⚙️</button>
  </div>

  <!-- Prikaz Pretraga -->
  <div class="main-content" id="searchView">
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" onkeyup="filterRestaurants()" placeholder="Pronađi svoj lokal (npr. Mondo)...">
    </div>

    <div class="restaurant-list" id="restaurantList"></div>
    <div id="noResults" class="info-text" style="display: none;">Nije pronađen nijedan lokal.</div>
  </div>

  <!-- Prikaz Čat -->
  <div class="chat-container" id="chatView">
    <div class="chat-header">
      <button class="btn-icon" onclick="exitChat()">⬅️</button>
      <img id="chatRestaurantLogo" src="" alt="Logo">
      <h3 id="selectedRestaurantTitle" style="font-size: 1rem; color: #fff;"></h3>
    </div>
    <div class="chat-body" id="chatMessages"></div>
    <div class="chat-footer">
      <input type="text" id="messageInput" class="chat-input" placeholder="Postavite pitanje ili naručite..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">Pošalji</button>
    </div>
  </div>

  <!-- Modal API -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>Podešavanja API Ključa</h3>
      <input type="password" id="apiKeyInput" placeholder="Unesite Gemini API Key">
      <button onclick="saveApiKey()">Sačuvaj</button>
      <button onclick="toggleModal('settingsModal', false)" style="background: #334155;">Zatvori</button>
    </div>
  </div>

  <!-- Modal QR Kod -->
  <div class="modal" id="qrModal">
    <div class="modal-content">
      <h3 id="qrModalTitle">QR Kod za Restoran</h3>
      <img id="qrCodeImg" class="qr-image" src="" alt="QR Code">
      <p style="font-size: 0.85rem; color: #94a3b8;">Skeniranjem ovog koda gost direktno otvara čat restorana.</p>
      <button onclick="toggleModal('qrModal', false)" style="background: #334155;">Zatvori</button>
    </div>
  </div>

  <script>
    const restaurants = [
      {
        id: "mondo-sarajevo",
        name: "Mondo Restaurant",
        city: "Sarajevo",
        code: "MO01",
        icon: "mondo-logo.png", // Putanja do fajla logotipa restorana
        prompt: `Ti si AI konobar u Mondo Restaurant u Sarajevu (lokacija: PC Capital Tower, Džemala Bijedića bb).
Radno vrijeme: do 23:00. Kontakt: 061 768 844. Prosječna cijena obroka je 15–20 KM po osobi. Dostava je moguća i preko Glovo-a.
Uvijek budi ljubazan i pomozi gostima oko menija, rezervacija i informacija o restoranu.`
      },
      {
        id: "monelnes",
        name: "MonElnes Restoran",
        city: "Beograd",
        code: "ME01",
        icon: "IMG_0827.png", // Zmeni sa npr. "monelnes-logo.png"
        prompt: "Ti si ljubazni AI konobar u luksuznom restoranu MonElnes. Nudiš vrhunska jela, vina i poslastice. Budi profesionalan i elegantan."
      }
    ];

    let currentRestaurant = null;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

      const urlParams = new URLSearchParams(window.location.search);
      const restaurantId = urlParams.get('r');

      if (restaurantId) {
        const target = restaurants.find(r => r.id === restaurantId);
        if (target) {
          openChat(restaurantId);
          return;
        }
      }

      renderRestaurants(restaurants);
    };

    function renderRestaurants(list) {
      const container = document.getElementById('restaurantList');
      const noResults = document.getElementById('noResults');
      container.innerHTML = '';

      if (list.length === 0) {
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      list.forEach(r => {
        container.innerHTML += `
          <div class="restaurant-card">
            <div class="card-left" onclick="openChat('${r.id}')">
              <img src="${r.icon}" alt="${r.name}">
              <div class="restaurant-info">
                <h3>${r.name}</h3>
                <p>${r.city} • Kod: ${r.code}</p>
              </div>
            </div>
            <button class="qr-btn" onclick="showQRCode(event, '${r.id}')">📱</button>
          </div>
        `;
      });
    }

    function filterRestaurants() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = restaurants.filter(r => 
        r.name.toLowerCase().includes(query) || 
        r.code.toLowerCase() === query || 
        r.city.toLowerCase().includes(query)
      );
      renderRestaurants(filtered);
    }

    function openChat(restaurantId) {
      currentRestaurant = restaurants.find(r => r.id === restaurantId);
      
      // Postavljanje naziva i logotipa restorana u čatu
      document.getElementById('selectedRestaurantTitle').innerText = currentRestaurant.name;
      document.getElementById('chatRestaurantLogo').src = currentRestaurant.icon;

      document.getElementById('searchView').style.display = 'none';
      document.getElementById('mainHeader').style.display = 'none';
      document.getElementById('chatView').style.display = 'flex';

      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = `
        <div class="msg bot">Dobrodošli u <b>${currentRestaurant.name}</b>! Ja sam vaš AI konobar. Kako vam mogu pomoći danas?</div>
      `;
    }

    function exitChat() {
      document.getElementById('chatView').style.display = 'none';
      document.getElementById('searchView').style.display = 'flex';
      document.getElementById('mainHeader').style.display = 'flex';
      currentRestaurant = null;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        chatMessages.innerHTML += `<div class="msg bot">Molimo podesite Gemini API ključ u podešavanjima (⚙️).</div>`;
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${currentRestaurant.prompt}\n\nKorisnik: ${text}` }]
            }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          chatMessages.innerHTML += `<div class="msg bot">API Greška: ${data.error.message}</div>`;
        } else {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Nema odgovora od modela.";
          chatMessages.innerHTML += `<div class="msg bot">${reply}</div>`;
        }
        
        chatMessages.scrollTop = chatMessages.scrollHeight;
      } catch (err) {
        chatMessages.innerHTML += `<div class="msg bot">Greška u mreži ili konekciji: ${err.message}</div>`;
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function toggleModal(modalId, show) {
      document.getElementById(modalId).style.display = show ? 'flex' : 'none';
    }

    function showQRCode(event, restaurantId) {
      event.stopPropagation();
      const restaurant = restaurants.find(r => r.id === restaurantId);
      const baseUrl = window.location.href.split('?')[0];
      const directUrl = `${baseUrl}?r=${restaurant.id}`;
      
      const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(directUrl)}`;
      
      document.getElementById('qrModalTitle').innerText = restaurant.name;
      document.getElementById('qrCodeImg').src = qrApi;
      toggleModal('qrModal', true);
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('gemini_api_key', key);
      toggleModal('settingsModal', false);
      alert('API Ključ je uspešno sačuvan!');
    }
  </script>
</body>
</html>
