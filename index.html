<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chart Analyzer</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #1f6feb;
            --accent-hover: #388bfd;
            --error-color: #f85149;
            --success-color: #2ea043;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #58a6ff;
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--accent-color);
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            position: relative;
            display: none;
            width: 100%;
        }

        .preview-container img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 6px;
        }

        .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--error-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button.btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }

        button.btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .response-area {
            margin-top: 15px;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .error-box {
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📈 AI Chart Analyzer</h1>
        <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    </div>

    <div class="card">
        <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
            <span id="uploadText">Dodaj ili nalepi screenshot grafikona</span>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <div class="preview-container" id="previewContainer">
            <img id="imagePreview" src="" alt="Chart Preview">
            <button class="remove-btn" onclick="removeImage()">×</button>
        </div>

        <div class="input-group">
            <input type="text" id="noteInput" placeholder="Opcionalno: Npr. 15m timeframe, EUR/USD...">
            <button class="btn-primary" id="analyzeBtn" onclick="analyzeChart()">Analiziraj</button>
        </div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="card response-area" id="responseCard" style="display: none;">
        <div id="responseContent"></div>
    </div>
</div>

<!-- Modal za API Key -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3>Podešavanja API Ključa</h3>
        <p style="font-size: 0.85rem; color: #8b949e;">Tvoj API ključ se čuva isključivo lokalno u pretraživaču (localStorage).</p>
        <input type="password" id="apiKeyInput" placeholder="Unesi Gemini API Ključ" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-primary" onclick="saveApiKey()">Sačuvaj</button>
        </div>
    </div>
</div>

<script>
    let currentBase64Image = null;

    window.onload = function() {
        const key = localStorage.getItem('gemini_api_key');
        if (!key) {
            document.getElementById('settingsModal').style.display = 'flex';
        }
    };

    function toggleSettings() {
        const modal = document.getElementById('settingsModal');
        const keyInput = document.getElementById('apiKeyInput');
        keyInput.value = localStorage.getItem('gemini_api_key') || '';
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (key) {
            localStorage.setItem('gemini_api_key', key);
            document.getElementById('settingsModal').style.display = 'none';
            hideError();
        }
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (file) processFile(file);
    }

    // Omogućava Paste slike direktno sa tastature (Ctrl+V)
    document.addEventListener('paste', function(e) {
        const items = e.clipboardData.items;
        for (let item of items) {
            if (item.type.indexOf('image') !== -1) {
                const blob = item.getAsFile();
                processFile(blob);
                break;
            }
        }
    });

    function processFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            currentBase64Image = e.target.result.split(',')[1];
            document.getElementById('imagePreview').src = e.target.result;
            document.getElementById('dropArea').style.display = 'none';
            document.getElementById('previewContainer').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    function removeImage() {
        currentBase64Image = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('dropArea').style.display = 'block';
        document.getElementById('previewContainer').style.display = 'none';
    }

    function showError(msg) {
        const box = document.getElementById('errorBox');
        box.innerText = msg;
        box.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorBox').style.display = 'none';
    }

    async function analyzeChart() {
        hideError();
        const apiKey = localStorage.getItem('gemini_api_key');
        
        if (!apiKey) {
            toggleSettings();
            return;
        }

        if (!currentBase64Image) {
            showError("Molimo vas da prvo dodate sliku grafikona.");
            return;
        }

        const note = document.getElementById('noteInput').value.trim();
        const btn = document.getElementById('analyzeBtn');
        const responseCard = document.getElementById('responseCard');
        const responseContent = document.getElementById('responseContent');

        btn.disabled = true;
        btn.innerText = "Analiziram...";
        responseCard.style.display = 'block';
        responseContent.innerText = "Generišem signal...";

        const promptText = `Deluješ kao ultra-direktni signal alogritam za trejding. 
Tvoj prvi i najvažniji zadatak je da napišeš JASNU I NEDVOSMISLENU ODLUKU u prvoj liniji.

Format odgovora MORA biti tačno ovakav na samom početku:

ODLUKA: [KLIKNI BUY / KLIKNI SELL / CEKAJ]
ULAZ (Entry): [Nivo cene]
STOP LOSS (SL): [Nivo cene]
TAKE PROFIT (TP): [Nivo cene]

Nakon toga daj maksimalno 2 kratke rečenice obrazloženja (npr. gde je FVG, BOS ili likvidnost). 

Dodatna napomena korisnika: ${note || "Nema dodatnih napomena"}`;

        const requestData = {
            contents: [{
                parts: [
                    { text: promptText },
                    {
                        inline_data: {
                            mime_type: "image/jpeg",
                            data: currentBase64Image
                        }
                    }
                ]
            }]
        };

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "Došlo je do greške prilikom pozivanja API-ja.");
            }

            const analysis = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (analysis) {
                responseContent.innerText = analysis;
            } else {
                showError("API nije vratio tekstualni odgovor za ovu sliku.");
            }

        } catch (err) {
            showError("API Greška: " + err.message);
            responseCard.style.display = 'none';
        } finally {
            btn.disabled = false;
            btn.innerText = "Analiziraj";
        }
    }
</script>

</body>
</html>
