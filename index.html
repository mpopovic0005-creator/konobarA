<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot - FVG, POC, Supply/Demand</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #f39c12; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #b0b0b0; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { background: #f39c12; color: #121212; border: none; padding: 10px 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #e67e22; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; text-align: center; font-size: 18px; font-weight: bold; }
        .buy { background: #27ae60; color: white; }
        .sell { background: #c0392b; color: white; }
        .wait { background: #7f8c8d; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Trading Signal Bot</h2>
    
    <div class="form-group">
        <label for="currentPrice">Trenutna Cena (npr. XAUUSD):</label>
        <input type="number" id="currentPrice" step="0.01" placeholder="Unesi cenu">
    </div>

    <div class="form-group">
        <label for="zoneType">Gde se cena trenutno nalazi?</label>
        <select id="zoneType">
            <option value="none">Izvan zona</option>
            <option value="demand">U Demand zoni (Zona kupovine)</option>
            <option value="supply">U Supply zoni (Zona prodaje)</option>
        </select>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" id="hasFVG"> Postoji li nezatvoreni FVG u blizini?
        </label>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" id="hasPOC"> Je li POC (Point of Control) blizu ulaza?
        </label>
    </div>

    <button onclick="checkSignal()">Proveri Signal</button>

    <div id="resultBox" class="result wait" style="display:none;">Čeka se analiza...</div>
</div>

<div style="text-align: center; margin-top: 20px; color: #777; font-size: 12px;">
    Lokalni alat za testiranje strategije
</div>

<script>
    function checkSignal() {
        const price = parseFloat(document.getElementById('currentPrice').value);
        const zone = document.getElementById('zoneType').value;
        const hasFVG = document.getElementById('hasFVG').checked;
        const hasPOC = document.getElementById('hasPOC').checked;
        const resultBox = document.getElementById('resultBox');

        resultBox.style.display = 'block';

        if (isNaN(price)) {
            resultBox.className = 'result wait';
            resultBox.innerHTML = 'Molimo unesite trenutnu cenu!';
            return;
        }

        // Osnovna logika strategije za konfluenciju
        if (zone === 'demand' && hasFVG && hasPOC) {
            resultBox.className = 'result buy';
            resultBox.innerHTML = '🚀 SIGNAL: BUY (Sve konfluencije ispunjene u Demand zoni!)';
        } else if (zone === 'supply' && hasFVG && hasPOC) {
            resultBox.className = 'result sell';
            resultBox.innerHTML = '🔻 SIGNAL: SELL (Sve konfluencije ispunjene u Supply zoni!)';
        } else {
            resultBox.className = 'result wait';
            resultBox.innerHTML = '⏳ ČEKAJ: Nema čiste konfluencije (Fale zone, FVG ili POC).';
        }
    }
</script>

</body>
</html>
