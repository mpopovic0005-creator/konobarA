<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional AI Chart Analyzer (PRO)</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #16181e;
            --accent-color: #2563eb;
            --text-color: #e2e8f0;
            --border-color: #27272a;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1, h2, h3 {
            margin-top: 0;
            color: #ffffff;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"], input[type="password"] {
            background: #090a0f;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .drop-zone {
            border: 2px dashed #3b82f6;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: #090a0f;
            transition: all 0.2s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background: #1e293b;
            border-color: #60a5fa;
        }

        .preview-img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            border: 1px solid var(--border-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #3f3f46;
            cursor: not-allowed;
        }

        .output-box {
            margin-top: 10px;
            display: none;
        }

        .signal-badge {
            font-size: 24px;
            font-weight: 800;
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        .BUY { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid #22c55e; }
        .SELL { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }
        .WAIT { background-color: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid #eab308; }

        .data-row {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .data-row strong {
            color: #f8fafc;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Institutional AI Chart Analyzer (PRO)</h1>

    <div class="card">
        <h3>Podešavanja API-ja</h3>
        <div class="settings-group">
            <label for="apiKey">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="Unesi svoj Gemini API ključ">
        </div>
    </div>

    <div class="card">
        <h3>Čart Analiza</h3>
        <div class="drop-zone" id="dropZone">
            <p>Prevuci sliku čarta, zalepi iz clipboarda (Ctrl+V) ili klikni za otvaranje</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <img id="previewImg" class="preview-img" alt="Čart Pregled">
        </div>
        <button id="analyzeBtn" onclick="runAnalysis()" disabled>Analiziraj sa Gemini 1.5 Pro</button>
    </div>

    <div class="card output-box" id="outputCard">
        <h3>SMC / ICT Dubinska Analiza</h3>
        <div id="analysisContent"></div>
    </div>
</div>

<script>
    let currentBase64Image = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewImg = document.getElementById('previewImg');
    const analyzeBtn = document.getElementById('analyzeBtn');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    document.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
            if (item.kind === 'file' && item.type.startsWith('image/')) {
                const blob = item.getAsFile();
                handleFile(blob);
                break;
            }
        }
    });

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            currentBase64Image = e.target.result;
            previewImg.src = currentBase64Image;
            previewImg.style.display = 'block';
            analyzeBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    }

    async function runAnalysis() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert("Unesi Gemini API ključ.");
            return;
        }

        if (!currentBase64Image) {
            alert("Ubaci sliku čarta.");
            return;
        }

        const outputCard = document.getElementById('outputCard');
        const analysisContent = document.getElementById('analysisContent');

        analyzeBtn.disabled = true;
        analyzeBtn.innerText = "Izvršava se dubinska SMC analiza...";
        outputCard.style.display = 'block';
        analysisContent.innerHTML = "<p style='color: #94a3b8;'>Model analizira likvidnost, HTF strukturu i imbalanse...</p>";

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`;

        const promptText = `
Ti si institucionalni risk menadžer i kvantitativni trejder specijalizovan za Smart Money Concepts (SMC) i ICT metodologiju.
Tvoj zadatak je da napraviš ultra-preciznu, bezkompromisnu i objektivnu analizu priloženog čarta.

AKSIOMI ANALIZE (BEZ ODSTUPANJA):
1. Bilo kakva sumnja, ekspanzija bez prethodnog sweep-a likvidnosti ili izostanak jasne potvrdne svećice MORA rezultirati signalom "WAIT".
2. Proveri sledeće elemente redom:
   - Trend & HTF Context (Bullish/Bearish/Range)
   - Liquidity Sweep (Da li je uzet BSL ili SSL pre ove reakcije?)
   - Market Structure Shift (MSS) ili Break of Structure (BOS)
   - Inefficiency / Fair Value Gap (FVG) ili Order Block (OB) koji služi kao Poi (Point of Interest).
3. Ne izmišljaj cene – navodi precizne nivoe sa čarta ako su vidljivi na osi, ili opisuj tačne zone.

ODGOVORI ISKLJUČIVO U VAŽEĆEM JSON FORMATU BEZ MARKDOWN WRAPPERA ILI DODATNOG TEKSTA:
{
  "signal": "BUY" | "SELL" | "WAIT",
  "confidence": "Visoka" | "Srednja" | "Niska",
  "market_bias": "Bullish" | "Bearish" | "Neutralan / Range",
  "technical_setup": {
    "structure": "Analiza BOS/MSS i trenutnog trenda",
    "liquidity_sweep": "Detalji o uzetoj likvidnosti (BSL/SSL)",
    "fvg_and_ob": "Analiza FVG neefikasnosti i Order Block zona"
  },
  "execution_plan": {
    "entry": "Precizna zona/cena ulaska",
    "stop_loss": "Invalidacioni nivo (SL)",
    "take_profit": "Ciljana likvidnost (TP)",
    "risk_reward": "Procenjeni R:R odnos"
  },
  "reasoning": "Iskreno, kritičko obrazloženje odluke u 2-3 jasne rečenice. Ako je WAIT, objasni šta tačno nedostaje za ulazak."
}
`;

        const requestBody = {
            contents: [
                {
                    parts: [
                        { text: promptText },
                        {
                            inline_data: {
                                mime_type: "image/png",
                                data: currentBase64Image.split(",")[1]
                            }
                        }
                    ]
                }
            ],
            generationConfig: {
                temperature: 0,
                topP: 1,
                responseMimeType: "application/json"
            }
        };

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error(`API Greška ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text;
            const res = JSON.parse(rawText);

            renderOutput(res);

        } catch (err) {
            console.error(err);
            analysisContent.innerHTML = `<p style="color: #ef4444;">Greška: ${err.message}. Proveri valjanost API ključa i internet konekciju.</p>`;
        } finally {
            analyzeBtn.disabled = false;
            analyzeBtn.innerText = "Analiziraj sa Gemini 1.5 Pro";
        }
    }

    function renderOutput(data) {
        const analysisContent = document.getElementById('analysisContent');
        analysisContent.innerHTML = `
            <div class="signal-badge ${data.signal}">
                ${data.signal} — Pouzdanost: ${data.confidence} | Bias: ${data.market_bias}
            </div>
            <div class="data-row"><strong>Struktura (BOS/MSS):</strong> ${data.technical_setup.structure}</div>
            <div class="data-row"><strong>Likvidnost (Sweep):</strong> ${data.technical_setup.liquidity_sweep}</div>
            <div class="data-row"><strong>FVG & Order Block:</strong> ${data.technical_setup.fvg_and_ob}</div>
            <hr>
            <div class="data-row"><strong>Entry (Ulaz):</strong> ${data.execution_plan.entry}</div>
            <div class="data-row"><strong>Stop Loss:</strong> ${data.execution_plan.stop_loss}</div>
            <div class="data-row"><strong>Take Profit:</strong> ${data.execution_plan.take_profit}</div>
            <div class="data-row"><strong>Risk / Reward:</strong> ${data.execution_plan.risk_reward}</div>
            <hr>
            <div class="data-row"><strong>Iskreno Obrazloženje:</strong> ${data.reasoning}</div>
        `;
    }
</script>

</body>
</html>
